<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Factory Dashboard</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#1b1f24;--muted:#5f6b7a;--line:#e3e7ec;--accent:#2f6fde;
--ok:#1f8a4c;--warn:#b26a00;--bad:#c62f2f;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--card:#171b21;--text:#e6e9ee;--muted:#93a0b0;
--line:#262c35;--accent:#6a9cff;--ok:#4cc483;--warn:#f0a83a;--bad:#ff6b6b;--chip:#1f252e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);
font:14px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1280px;margin:0 auto;padding:20px 16px 40px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
h1{font-size:20px;margin:0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.muted{color:var(--muted)}.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{padding:3px 9px;border-radius:999px;background:var(--chip);font-size:12px;white-space:nowrap}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn);font-weight:600}.pill.bad{color:var(--bad);font-weight:600}
.timeline{display:flex;flex-wrap:wrap;gap:6px}
.step{padding:6px 10px;border-radius:8px;background:var(--chip);color:var(--muted);font-size:12px}
.step.done{color:var(--ok)}.step.done::before{content:"✓ "}
.step.now{background:var(--accent);color:#fff;font-weight:600}
.bar{height:10px;background:var(--chip);border-radius:999px;overflow:hidden;margin-top:8px}
.bar>div{height:100%;background:var(--accent)}.bar.hot>div{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.col h3{font-size:12px;margin:0 0 8px;color:var(--muted)}
.task{border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;font-size:13px}
.task b{display:block}.task .meta{color:var(--muted);font-size:12px}
.split{display:grid;grid-template-columns:2fr 1fr;gap:14px}@media (max-width:860px){.split{grid-template-columns:1fr}}
.ev{border-top:1px solid var(--line);padding:7px 0;font-size:13px}.ev:first-child{border-top:0}
.ev .k{font-weight:600}.ev ul{margin:4px 0 0 18px;padding:0;color:var(--muted)}
pre{white-space:pre-wrap;word-break:break-word;margin:0;font:12px/1.5 ui-monospace,Consolas,monospace;max-height:420px;overflow:auto}
.feed{max-height:620px;overflow:auto}
</style></head><body><main>
<header><h1 id="title">Factory</h1><span class="muted" id="updated">connecting…</span></header>
<section class="card"><h2>Phase</h2><div class="timeline" id="timeline"></div>
<div class="row" style="margin-top:12px" id="badges"></div></section>
<section class="card"><h2>Spend</h2><div class="row"><span id="spend"></span></div><div class="bar" id="bar"><div></div></div></section>
<section class="card"><h2>Task board</h2><div class="grid" id="board"></div></section>
<div class="split">
<section class="card"><h2>Evidence feed (newest first)</h2><div class="feed" id="events"></div></section>
<section class="card"><h2>Inbox for you</h2><pre id="inbox"></pre></section>
</div>
</main>
<script>
const COLS=[["To do",["open"]],["Working",["claimed","in_progress"]],["Checks",["ci"]],["Review",["review"]],
["Done",["approved","merged"]],["Halted",["halted"]]];
const LABEL={gate2:"architecture approval",gate3:"release approval"};
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ago=t=>{const s=Math.max(0,(Date.now()-new Date(t))/1000);return s<90?Math.round(s)+"s":s<5400?Math.round(s/60)+"m":(s/3600).toFixed(1)+"h"};
function render(d){
 document.title=d.project+" · factory";document.getElementById("title").textContent="Factory · "+d.project;
 document.getElementById("updated").textContent="updated "+new Date().toLocaleTimeString()+" · branch "+d.branch;
 const i=d.phases.indexOf(d.phase);
 document.getElementById("timeline").innerHTML=d.phases.map((p,j)=>`<span class="step ${j<i?"done":j===i?"now":""}">${esc(p)}</span>`).join("");
 const b=[];
 if(d.stopped)b.push(`<span class="pill bad">KILL SWITCH ENGAGED</span>`);
 d.pending_gates.forEach(g=>b.push(`<span class="pill warn">Waiting for you: ${LABEL[g]} → factory approve ${esc(d.project)}</span>`));
 if(d.running)b.push(`<span class="pill ok">● running ${esc(d.running.name)} for ${ago(d.running.started)}</span>`);
 else if(d.phase!=="done")b.push(`<span class="pill">no agent running</span>`);
 b.push(`<span class="pill ${d.chain==="intact"?"ok":"bad"}">evidence chain ${esc(d.chain)}</span>`);
 b.push(`<span class="pill">autonomy L${d.autonomy}</span><span class="pill">authors ${esc(d.models.author)} · reviewers ${esc(d.models.reviewer)}</span>`);
 document.getElementById("badges").innerHTML=b.join("");
 const pct=Math.min(100,100*d.cost/d.budget);
 document.getElementById("spend").textContent=`$${d.cost.toFixed(2)} of $${d.budget.toFixed(2)} (${pct.toFixed(0)}%)`;
 const bar=document.getElementById("bar");bar.firstElementChild.style.width=pct+"%";bar.classList.toggle("hot",pct>80);
 document.getElementById("board").innerHTML=d.tasks.length?COLS.map(([name,sts])=>{
  const ts=d.tasks.filter(t=>sts.includes(t.status));
  return `<div class="col"><h3>${name} (${ts.length})</h3>${ts.map(t=>`<div class="task"><b>${esc(t.id)} ${t.security?"🔒":""}</b>${esc(t.title)}
  <div class="meta">${esc(t.role)} · ${esc(t.status)} · $${(t.cost_usd||0).toFixed(2)} · retries ${t.ci_retries} · reviews ${t.review_rounds}</div></div>`).join("")}</div>`}).join("")
  :`<span class="muted">Tasks appear after the Tech Lead's task plan is accepted.</span>`;
 document.getElementById("events").innerHTML=d.events.map(e=>{
  const x=e.detail,head=[x.task,x.role||x.reviewer,x.label||x.layer,x.verdict,x.from&&x.from+" → "+x.to,x.gate].filter(Boolean).map(esc).join(" · ");
  const flags=[x.ok===false?"failed":"",x.blocking?"blocking":"",x.approved===true?"approved":x.approved===false?"rejected":""].filter(Boolean);
  const list=[...(x.violations||[]),...(x.findings||[]),...(x.untested?["untested: "+x.untested.join(", ")]:[]),...(x.reason?[x.reason]:[]),...(x.why?[x.why]:[])];
  return `<div class="ev"><span class="k">${esc(e.kind)}</span> <span class="muted">#${e.seq} · ${ago(e.at)} ago${x.cost_usd!=null?" · $"+Number(x.cost_usd).toFixed(2):""}</span>
  ${flags.length?` <span class="pill ${x.blocking||x.ok===false||x.approved===false?"bad":"ok"}">${flags.join(", ")}</span>`:""}
  <div>${head}</div>${list.length?`<ul>${list.map(l=>`<li>${esc(l)}</li>`).join("")}</ul>`:""}</div>`}).join("")||`<span class="muted">No events yet.</span>`;
 document.getElementById("inbox").textContent=d.inbox||"Nothing for you right now.";
}
async function tick(){try{const r=await fetch("/api",{cache:"no-store"});render(await r.json())}
catch(e){document.getElementById("updated").textContent="dashboard server not reachable"}}
tick();setInterval(tick,3000);
</script></body></html>
