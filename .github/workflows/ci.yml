name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - name: lint (ruff, all rules)
        run: uv run ruff check . && uv run ruff format --check .
      - name: types (mypy strict)
        run: uv run mypy
      - name: tests
        run: uv run pytest -q
